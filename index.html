<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>프로젝트 선택</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0f172a;
        color: #f8fafc;
      }

      .wrapper {
        width: min(680px, 100%);
        padding: 32px;
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.96);
        border: 1px solid rgba(148, 163, 184, 0.16);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.35);
      }

      h1 {
        font-size: clamp(2rem, 3vw, 3rem);
        margin-bottom: 16px;
      }

      p {
        color: #cbd5e1;
        margin-bottom: 24px;
        line-height: 1.75;
      }

      .projects {
        display: grid;
        gap: 16px;
      }

      .project-link {
        display: block;
        padding: 18px 22px;
        border-radius: 16px;
        text-decoration: none;
        background: #1e293b;
        color: #f8fafc;
        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }

      .project-link:hover {
        transform: translateY(-2px);
        background: #334155;
      }

      .project-link strong {
        display: block;
        margin-bottom: 6px;
        font-size: 1.1rem;
      }

      .project-link span {
        color: #cbd5e1;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="wrapper">
      <h1>프로젝트 선택</h1>
      <p>
        원하는 프로젝트를 선택하면 해당 기능이 실행됩니다. 현재는 프로젝트별로
        폴더로 정리되어 있습니다.
      </p>
      <div class="projects">
        <a class="project-link" href="random-picker/random_picker.html">
          <strong>Random Picker</strong>
          <span>현재 만든 게임을 실행합니다 (random_picker.html).</span>
        </a>
      </div>
    </main>
  </body>
</html>
